# Builds the static site and publishes dist/ to GitHub Pages.
# Inert until the repository exists and Settings → Pages → Source is "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The Google API key goes into the built site only; public/config.js in the repository keeps the placeholder.
      # It comes from the GOOGLE_API_KEY repository secret through env, never on the command line, and the script
      # never prints it. Without the secret, dist/config.js keeps the placeholder and paid unlock stays off.
      - name: Write the Google API key into dist/config.js
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: npx tsx scripts/write-config.ts dist/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
