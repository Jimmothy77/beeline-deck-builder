<!DOCTYPE html>

<head>
<meta charset="utf-8">

<title>Horror Movie Poster (option C: the door) — BeeLine splash</title>

<style>
  body{background:#020101}
  .stage{background:#030202}
  .push{position:absolute;inset:0;animation:push 2.4s cubic-bezier(.3,.1,.3,1)}
  @keyframes push{from{transform:scale(1.08)}to{transform:scale(1)}}
  .stage{--dh:min(46vh,90vw);--dw:calc(var(--dh) * .44);--dt:80%}
  @media (orientation:portrait){.stage{--dh:min(40vh,80vw);--dt:74%}}

  @property --sw{syntax:'<percentage>';inherits:false;initial-value:0%}

  @keyframes dust{0%,40%{opacity:0;transform:translate(0,0)}60%{opacity:.8}100%{opacity:.6;transform:translate(var(--dx),var(--dy))}}
  .title{position:absolute;left:50%;top:calc(var(--dt) - var(--dh) - 6vh);transform:translate(-50%,-100%);text-align:center;white-space:nowrap}
  .t1{display:block;font:400 min(15vw,16vh)/.9 "BL Anton",sans-serif;letter-spacing:.12em;padding-left:.12em;color:#ead9bd;

  .t2{display:block;margin-top:.35em;font:400 min(4.6vw,4.2vh)/1 "BL Anton",sans-serif;letter-spacing:.5em;padding-left:.5em;color:#e0482c;text-shadow:0 0 .6em rgba(220,60,30,.45);animation:t2 .6s 1.4s ease-out}
  @keyframes t2{from{opacity:0;letter-spacing:.9em}to{opacity:1;letter-spacing:.5em}}
  .tag{position:absolute;left:50%;bottom:max(6vh,env(safe-area-inset-bottom));transform:translateX(-50%);white-space:nowrap;font:italic 500 min(4vw,3.4vh)/1 "BL Cormorant",serif;color:#d9b48a;letter-spacing:.12em;opacity:0;animation:fade .6s 1.6s ease-out}

  /* wide / landscape: bigger door, figure and floor shadow; title moves to the left of the door */
  @media (orientation:landscape){
    .stage{--dh:min(72vh,58vw);--dt:73%}
    .door,.spill{left:63%}
    .wall{background:radial-gradient(34% 62% at 63% var(--dt),rgba(130,75,32,.34),transparent 70%)}
    .fig{height:98%}
    .shadow{left:39%;width:15%;background:linear-gradient(180deg,rgba(0,0,0,.97),rgba(0,0,0,.86) 55%,rgba(0,0,0,.35));clip-path:polygon(38% 0,46% 0,50% 22%,54% 0,62% 0,67% 36%,84% 72%,98% 100%,2% 100%,16% 72%,33% 36%)}
    .spill::before{background:linear-gradient(180deg,rgba(255,198,120,.88),rgba(236,150,66,.52) 50%,rgba(140,70,24,.14))}
    .dust{position:absolute;inset:0;transform:translateX(13vw)}
    .title{left:27%;top:44%;transform:translate(-50%,-50%)}
    .t1{font-size:min(10vw,19vh)}
    .t2{font-size:min(3.4vw,4.6vh)}
    .tag{left:27%;bottom:auto;top:calc(44% + min(10vw,19vh) * .62 + 6vh)}

  .grain{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;opacity:.12}
  .vig{position:absolute;inset:0;background:radial-gradient(closest-side at 50% 55%,transparent 40%,rgba(0,0,0,.9))}
</style>

<script>
