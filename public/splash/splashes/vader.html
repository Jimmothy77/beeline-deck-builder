<!DOCTYPE html>
<html lang="en" data-slug="vader" data-duration="2300" data-poster="1750">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vader — BeeLine splash</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../splash-base.css">
<style>
  body{background:#000}
  .stage{background:radial-gradient(120vmax 80vmax at 50% 55%,#12060a 0%,#040103 45%,#000 75%)}
  .stars{position:absolute;inset:-6%;animation:drift 2.3s cubic-bezier(.2,.6,.3,1)}
  .stars svg{width:100%;height:100%}
  .stars circle{fill:#fff}
  .tw{animation:tw 1.1s ease-in-out infinite alternate}
  @keyframes drift{from{transform:scale(1.08)}to{transform:scale(1)}}
  @keyframes tw{from{opacity:.25}to{opacity:1}}

  /* breathing respirator pulse: two slow beats */
  .breath{position:absolute;left:50%;top:50%;width:150vmin;height:150vmin;margin:-75vmin 0 0 -75vmin;border-radius:50%;
    background:radial-gradient(circle,rgba(190,12,22,.34) 0%,rgba(120,0,10,.16) 28%,transparent 58%);
    animation:breath 2.3s ease-in-out}
  @keyframes breath{0%{opacity:0;transform:scale(.7)}22%{opacity:.9;transform:scale(1)}44%{opacity:.35;transform:scale(.88)}70%{opacity:1;transform:scale(1.04)}100%{opacity:.55;transform:scale(.96)}}
  .grill{position:absolute;left:50%;top:50%;width:min(96vw,150vh);height:min(52vw,46vh);transform:translate(-50%,-50%);
    background:repeating-linear-gradient(0deg,rgba(255,40,50,.07) 0 1px,transparent 1px 7px);
    -webkit-mask:radial-gradient(closest-side,#000 30%,transparent 100%);mask:radial-gradient(closest-side,#000 30%,transparent 100%);
    animation:grill 2.3s ease-in-out}
  @keyframes grill{0%,10%{opacity:0}25%{opacity:1}45%{opacity:.4}70%{opacity:1}100%{opacity:.6}}
  .rings{position:absolute;left:50%;top:50%;width:min(80vmin,620px);height:min(80vmin,620px);transform:translate(-50%,-50%)}
  .rings circle{fill:none;stroke:#ff2a35;transform-origin:50% 50%;transform-box:fill-box}
  .rings .r1{stroke-width:.5;opacity:.0;animation:ring 2.3s ease-in-out}
  .rings .r2{stroke-width:.35;stroke-dasharray:2 3;animation:ring 2.3s .08s ease-in-out}
  .rings .r3{stroke-width:.25;animation:ring 2.3s .16s ease-in-out}
  @keyframes ring{0%,8%{opacity:0;transform:scale(.6)}24%{opacity:.5;transform:scale(1)}46%{opacity:.12;transform:scale(.94)}72%{opacity:.45;transform:scale(1.03)}100%{opacity:.2;transform:scale(.99)}}

  /* blade */
  .saber{position:absolute;left:50%;top:58%;width:min(76vw,124vh);height:0;transform:translateX(calc(-50% + min(6.5vw,9vh)))}
  .hilt{position:absolute;right:100%;top:50%;width:min(13vw,18vh);height:min(2.6vw,3.6vh);transform:translateY(-50%);
    border-radius:3px 1px 1px 3px;
    background:linear-gradient(180deg,#5b5f66 0%,#d7dbe0 22%,#7c8188 45%,#22252a 60%,#4a4e55 100%);
    animation:hiltIn .35s cubic-bezier(.2,.8,.2,1)}
  .hilt::before{content:"";position:absolute;inset:0 28% 0 18%;background:repeating-linear-gradient(90deg,#111 0 2px,transparent 2px 6px);opacity:.8}
  .hilt::after{content:"";position:absolute;right:-3px;top:-25%;width:8%;height:150%;background:linear-gradient(180deg,#9aa0a8,#2a2d33);border-radius:1px}
  @keyframes hiltIn{from{opacity:0;transform:translate(-20px,-50%)}to{opacity:1;transform:translate(0,-50%)}}
  .blade{position:absolute;left:0;top:50%;width:100%;height:max(5px,.9vmin);border-radius:0 99px 99px 0;transform-origin:0 50%;
    background:linear-gradient(180deg,#ffd9dc,#fff 40%,#fff 60%,#ffd0d4);
    box-shadow:0 0 2px #fff,0 0 6px #ff3b46,0 0 14px #ff1a28,0 0 30px #e0000f,0 0 64px rgba(230,0,20,.7),0 0 120px rgba(200,0,20,.45);
    margin-top:calc(max(5px,.9vmin) / -2);
    animation:ignite .32s .38s cubic-bezier(.15,.85,.25,1),hum 2.3s linear}
  @keyframes ignite{0%{transform:scaleX(0)}70%{transform:scaleX(1.015)}100%{transform:scaleX(1)}}
  @keyframes hum{0%,16%{filter:brightness(1)}30%{filter:brightness(1.6)}34%{filter:brightness(1)}52%{filter:brightness(1.15)}55%{filter:brightness(.92)}58%{filter:brightness(1.12)}100%{filter:brightness(1)}}
  .flash{position:absolute;left:0;top:50%;width:100%;height:min(30vmin,220px);transform:translateY(-50%);
    background:radial-gradient(50% 50% at 50% 50%,rgba(255,60,70,.55),transparent 70%);mix-blend-mode:screen;
    animation:flash .7s .45s ease-out}
  @keyframes flash{0%{opacity:0;transform:translateY(-50%) scaleY(.2)}25%{opacity:1}100%{opacity:0;transform:translateY(-50%) scaleY(1.6)}}
  .floor{position:absolute;left:-10%;right:-10%;top:58%;height:min(50vh,60vw);transform:translateY(-50%);
    background:radial-gradient(50% 50% at 50% 50%,rgba(255,20,35,.2),transparent 70%);animation:floor .5s .5s ease-out}
  @keyframes floor{from{opacity:0}to{opacity:1}}

  /* title, lit from below by the blade */
  .title{position:absolute;left:50%;top:58%;transform:translate(-50%,-128%);white-space:nowrap;
    font:400 min(10.4vw,15vh)/1 "BL Michroma",sans-serif;letter-spacing:.34em;padding-left:.34em;
    color:transparent;background:linear-gradient(180deg,#2a2d33 0%,#6d727a 38%,#c9ced6 62%,#ff5560 86%,#ff9aa0 100%);
    -webkit-background-clip:text;background-clip:text;
    filter:drop-shadow(0 .06em .12em rgba(255,20,35,.45));
    animation:reveal .55s .5s cubic-bezier(.3,.7,.2,1)}
  @keyframes reveal{from{clip-path:inset(-20% 100% -20% 0);opacity:.2}to{clip-path:inset(-20% 0 -20% 0);opacity:1}}
  .sub{position:absolute;left:50%;top:58%;transform:translate(-50%,110%);margin-top:min(5vw,6vh);white-space:nowrap;
    font:400 min(2.4vw,2.6vh)/1 "BL Michroma",sans-serif;letter-spacing:.8em;padding-left:.8em;color:#ff4450;text-shadow:0 0 8px rgba(255,40,50,.6);
    animation:subIn .6s 1.05s ease-out}
  @keyframes subIn{from{opacity:0;letter-spacing:1.4em}to{opacity:1;letter-spacing:.8em}}
  .vig{position:absolute;inset:0;background:radial-gradient(closest-side,transparent 60%,rgba(0,0,0,.75) 100%);pointer-events:none}
</style>
</head>
<body>
<main class="stage" aria-label="Vader deck intro">
  <div class="stars"><svg id="stars" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice"></svg></div>
  <div class="breath"></div>
  <div class="grill"></div>
  <svg class="rings" viewBox="0 0 100 100"><circle class="r1" cx="50" cy="50" r="48"/><circle class="r2" cx="50" cy="50" r="41"/><circle class="r3" cx="50" cy="50" r="34"/></svg>
  <div class="floor"></div>
  <div class="title">VADER</div>
  <div class="saber"><div class="flash"></div><div class="hilt"></div><div class="blade"></div></div>
  <div class="sub">DECK · ONLINE</div>
  <div class="vig"></div>
</main>
<script>
(function(){ // deterministic starfield
  let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  const svg=document.getElementById('stars');let h='';
  for(let i=0;i<260;i++){const x=r()*1000,y=r()*1000,z=r();const rad=(z<.9?.6+z*.9:1.6+r()*1.2).toFixed(2);
    h+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad}" opacity="${(.3+z*.7).toFixed(2)}" ${z>.75?`class="tw" style="animation-delay:-${(r()*1.1).toFixed(2)}s"`:''}/>`;}
  svg.innerHTML=h;
})();
</script>
<script src="../splash-runtime.js"></script>
</body>
</html>
